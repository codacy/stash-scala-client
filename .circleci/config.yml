version: 2.1

orbs:
  codacy: codacy/base@12.2.0

cache_prefix: &cache_prefix sbt-cache-18062027

workflows:
  version: 2
  build:
    jobs:
      - codacy/checkout_and_version:
          write_sbt_version: true
      - codacy/sbt:
          name: populate_cache
          persist_to_workspace: true
          cmd: sbt "+update"
          cache_prefix: *cache_prefix
          requires:
            - codacy/checkout_and_version
      - codacy/sbt:
          name: compile_and_test
          persist_to_workspace: true
          cache_prefix: *cache_prefix
          steps_before_sbt:
            - run:
                name: Enable coverage
                command: echo "ThisBuild / coverageEnabled := true" > coverage.sbt
          steps:
            - run:
                name: Check formatting (all files)
                command: sbt "scalafmtCheckAll;scalafmtSbtCheck"
            - run:
                name: Compile main and test
                command: sbt "coverage;+compile;+test:compile"
            - run:
                name: Unit testing
                command: sbt test
            - run:
                name: Integration testing
                command: sbt "it:test"
            - run:
                name: Aggregate coverage reports
                command: sbt coverageAggregate
            - run:
                name: Send coverage report to Codacy
                command: |
                  bash <(curl -Ls https://coverage.codacy.com/get.sh)
            - run:
                name: Clean coverage.sbt from cache
                command: rm coverage.sbt
          requires:
            - populate_cache
      - codacy/tag_version:
          name: tag_version
          context: CodacyAWS
          requires:
            - compile_and_test
          filters:
            branches:
              only:
                - master
      - codacy/sbt:
          name: publish
          context: CodacyAWS
          cmd: |
            sbt "retrieveGPGKeys;+publishSigned"
            sbt "retrieveGPGKeys" -DplayVersion="2.4.3" "++2.11.12;publishSigned"
            sbt "retrieveGPGKeys" -DplayVersion="2.7.4" "++2.11.12;publishSigned;sonatypeCentralRelease"
          requires:
            - tag_version
